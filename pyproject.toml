[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "syncai-tts"
version = "0.1.0"
description = "Speech synthesis and speaker playback for the SyncAI robot, as a standalone REST service."
readme = "README.md"
# 3.10 is the robot container's interpreter (JetPack 6.2 / Ubuntu 22.04), and
# .python-version pins dev to the same one. The upper bound is kokoro-onnx's.
# Note onnxruntime drops 3.10 in 1.24.4: moving past 1.23.x means moving the
# container's interpreter too.
requires-python = ">=3.10,<3.14"

dependencies = [
    # ── Web stack ────────────────────────────────────────────────────────────
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2.11",  # Field(ge=/le=) on floats + model_config; 2.11 matches syncai_backend
    "structlog",       # every module logs through structlog (see logger.py)
    "python-dotenv",   # main.py loads .env before Settings.from_env()

    # ── Inference ────────────────────────────────────────────────────────────
    # onnxruntime is pinned exactly, and the pin is a hardware decision.
    #
    # It sat at 1.18.1 for two years because >= 1.19's CPU-topology probe
    # corrupts the heap on the Jetson Orin whenever nvpmodel keeps cores offline
    # (MODE_30W offlines 8-11) — a malloc assertion at InferenceSession
    # construction, not something the caller can catch. See
    # https://github.com/microsoft/onnxruntime/discussions/22011 for the class
    # of failure.
    #
    # 1.23.2 is the last release that still ships a cp310 aarch64 wheel (1.24.4
    # requires >= 3.11), which is what makes this upgrade a pin change and
    # nothing else. Whether the Orin bug is actually gone can only be settled on
    # the device, with cores offline; see CLAUDE.md for the check.
    "onnxruntime==1.23.2",
    # No ceiling any more: ORT gained numpy 2 support in 1.19/1.20, and the old
    # `numpy<2` belonged to the 1.18.1 pin rather than to ROS. Imported directly
    # by engine.py, so it is declared here rather than left to kokoro-onnx.
    "numpy>=2",
    # Installed normally now. Its metadata (onnxruntime>=1.20.1, numpy>=2.0.2)
    # is satisfied by the pins above, so the [tool.uv] override-dependencies
    # block that used to overrule it is gone, and so is the `pip install
    # --no-deps` it replaced.
    "kokoro-onnx",
]

[project.scripts]
syncai-tts = "syncai_tts.main:main"

[dependency-groups]
# Installed by `uv sync`, excluded by `uv sync --no-dev` (what the runtime image
# does). Nothing here needs onnxruntime, ALSA or a model file: the suite fakes
# the kokoro session and patches the aplay subprocess.
dev = [
    "pytest>=7,<9",
    "httpx",  # required by fastapi.testclient.TestClient
    "ruff",
]

[tool.setuptools]
packages = ["syncai_tts", "syncai_tts.api"]

[tool.pytest.ini_options]
testpaths = ["test"]
