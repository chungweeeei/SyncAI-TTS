# Standalone compose for syncai_tts. On the robot this service is folded into
# the workspace's compose stack instead; keep the device, volume and network
# wiring below in step with it, because that wiring is the whole difficulty of
# running this.

services:
  tts:
    build:
      context: .
      target: runtime
    image: syncai-tts
    container_name: syncai_tts
    restart: unless-stopped

    # Deliberately no `ports:`. Nothing outside the docker network speaks to
    # this service: the callers are syncai_backend and the Temporal worker,
    # both containers on the `syncai` network below, and they reach it by name
    # at http://syncai_tts:8080. Publishing the port would expose the speaker
    # to anything on the robot's LAN, and there is no authentication here.
    # `expose` documents the port; it publishes nothing.
    expose:
      - "8080"

    # /dev/snd is the sound card. /dev/syncai carries the udev symlink
    # (speaker_pcm -> ../snd/pcmC<card>D<dev>p) that syncai_sys_manager's
    # 99-syncai-devices.rules maintains; the service reads it per utterance so a
    # replug that moves the card number is followed rather than cached.
    devices:
      - /dev/snd:/dev/snd
    volumes:
      - /dev/syncai:/dev/syncai:ro
      # The weights, ~310 MB, live in this repo under models/ (gitignored) and
      # are mounted rather than baked into the image, which would be rebuilt
      # and re-pushed on every source change. See models/README.md to fetch
      # them.
      - ./models/kokoro:/models/kokoro:ro

    # The container user is in `audio`, but the host's audio gid is what governs
    # /dev/snd. Set this to the host's: `getent group audio | cut -d: -f3`.
    group_add:
      - "29"

    environment:
      # 0.0.0.0 so other containers on the network can reach it. Nothing is
      # published to the host, so this is not a LAN exposure — see `expose`.
      TTS_HOST: "0.0.0.0"
      TTS_PORT: "8080"
      TTS_PRELOAD: "true"
      TTS_LOG_JSON: "false"
      TTS_MAX_QUEUE: "8"
      # Left unset: the callers are server-side containers, not browsers, and
      # none of them is subject to CORS.
      # TTS_CORS_ORIGINS: ""

    networks:
      - syncai

networks:
  syncai:
    # Named explicitly so it is `syncai` rather than `syncai-tts_syncai`, and a
    # caller's own compose file can join it with:
    #
    #   networks:
    #     syncai:
    #       external: true
    #
    # Whichever stack comes up first creates it.
    name: syncai
    driver: bridge
